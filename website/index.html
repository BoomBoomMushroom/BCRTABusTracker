<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BCRTA Realtime Bus Tracker</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    </head>
    <body>
        <style>
            #map{
                position: absolute;
                left: 0px;
                top: 0px;
                width: 100%;
                height: 100%;
            }

            .routeControl{
                background-color: white;
                padding: 5px;
            }
            .routeRow{
                display: flex;
                padding-bottom: 5px;
            }
            .routeLabel{
                width: 30px;
                aspect-ratio: 1 / 1;
                border-radius: 50%;
                color: #fff;
                text-align: center;
                
                background: #000;
                
                display: inline-flex;
                align-items: center;
                justify-content: center;
                
                /* margin: 0; */
                margin: 0 5px 0 0;
                vertical-align: middle;
            }

            .vehicleInfo{
                display: flex;
                justify-content: space-between;
            }

            .directionArrow{
                background: transparent;
                border: none;
            }

            .arrow{
                position: relative;
                width: 30px;
                height: 60px;
                transform-origin: 15px 60px;
            }

            .arrowLine{
                position: absolute;
                width: 5px;
                height: 38px;
                background: #000000;
                left: 12.5px;
                top: 7px;
                border-radius: 3px;
            }

            .arrowHead{
                position: absolute;
                width: 0;
                height: 0;
                left: 6px;
                top: 0;

                border-left: 9px solid transparent;
                border-right: 9px solid transparent;
                border-bottom: 12px solid #000000;
            }
        </style>
        <div id="map"></div>

        <script>
            // map.js
            var oxfordOhio = [39.5103048, -84.7420519]
            var map = L.map("map").setView(oxfordOhio, 14)

            let stops = {} // key,val = stopId, Stop
            let shapes = {} // key,val = shapeId, Shape
            let routes = {} // key,val = routeId, Route
            let trips = {} // key,val = tripId, Trip
            let vehicles = {} // key,val = vehicleId, Vehicle

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            let routeControl = L.control({position: "topright"})
            routeControl.onAdd = (map) => {
                let div = L.DomUtil.create("div", "routeControl")
                div.innerHTML = `
                    <div class="routeTitle">Routes</div>
                    <div id="routeList"></div>
                `;
                L.DomEvent.disableClickPropagation(div)
                return div
            }
            routeControl.addTo(map)

            function addRouteToControl(routeId){
                let list = document.getElementById("routeList")

                let row = document.createElement("div")
                row.className = "routeRow"

                let checkbox = document.createElement("input")
                checkbox.type = "checkbox"
                checkbox.checked = routes[routeId].showRoute

                let label = document.createElement("p")
                label.className = "routeLabel"
                label.textContent = routes[routeId].shortName
                label.style.backgroundColor = "#" + routes[routeId].color
                label.style.color = "#" + routes[routeId].textColor
                
                checkbox.addEventListener("change", ()=>{
                    if(checkbox.checked){
                        lineKeys = Object.keys(routes[routeId].polyLine)
                        lineKeys.forEach(pKey => {
                            let pLine = routes[routeId].polyLine[pKey]
                            pLine.addTo(map)
                        });
                    }
                    else{
                        lines = Object.values(routes[routeId].polyLine)
                        lines.forEach(pLine => {
                            map.removeLayer(pLine)
                        });
                    }
                    routes[routeId].isRouteShown = checkbox.checked
                })
                checkbox.dispatchEvent(new Event("change")) // update if it's shown or not based on the current value

                row.appendChild(checkbox)
                row.appendChild(label)
                list.appendChild(row)
            }

            function createRoutePolyline(points, color){
                if(color.startsWith("#") == false){ color = "#" + color }
                poly = L.polyline(points, {
                    color: color,
                    weight: 6,
                    opacity: 1
                })
                poly.addTo(map)
                return poly
            }

            function createDirectionArrow(vehicleId){
                let zoom = map.getZoom()
                let size = zoom * 1.5
                let v = vehicles[vehicleId]

                let arrowWidth = 30
                let arrowHeight = 60

                let arrow = L.marker(v.getPosition(), {
                    icon: L.divIcon({
                        className: "directionArrow",
                        html: `
                            <div class="arrow">
                                <div class="arrowHead"></div>
                                <div class="arrowLine"></div>
                            </div>
                        `,
                        iconSize: [arrowWidth, arrowHeight],
                        iconAnchor: [arrowWidth/2, arrowHeight],
                    }),
                    interative: false,
                    zIndexOffset: -1000, // make go under the bus so we can click the bus and not the arrow
                })
                arrow.addTo(map)
                arrow.getElement().querySelector(".arrow").style.transform = `rotate(${v.getBearing()}deg)`

                return arrow
            }

            function getBusStopIcon(){
                let zoom = map.getZoom()
                let size = zoom * 1.5

                return new L.Icon({
                    iconUrl: "./busStop.svg",
                    iconSize: [size,size],
                    iconAnchor: [size/2, size/2]
                })
            }
            function createBusStopIcon(stopId){
                // -100 zindex to prioritize the bus, and still be above the bus's arrows
                let marker = L.marker(stops[stopId].getPosition(), { icon: getBusStopIcon(), zIndexOffset: -100, })
                marker.bindPopup(stops[stopId].getPopupText())
                marker.addTo(map)
                return marker
            }

            function getVehicleIcon(){
                let zoom = map.getZoom()
                let size = zoom * 1.5
                //console.log(zoom, size)

                return new L.Icon({
                    iconUrl: "./bus.png",
                    iconSize: [size,size],
                    iconAnchor: [size/2, size/2]
                })
            }
            function createVehicleIcon(vehicleId){
                let marker = L.marker(vehicles[vehicleId].getPosition(), { icon: getVehicleIcon() })
                marker.bindPopup(vehicles[vehicleId].getPopupText())
                marker.addTo(map)
                return marker
            }
            map.on("zoomend", ()=>{
                let vehicleIcon = getVehicleIcon()
                let busStopIcon = getBusStopIcon()

                Object.keys(vehicles).forEach((vehicleId)=>{
                    let v = vehicles[vehicleId]
                    v.icon.setIcon(vehicleIcon)
                })

                Object.keys(stops).forEach((stopId)=>{
                    let s = stops[stopId]
                    s.icon.setIcon(busStopIcon)
                })
            })
            
        </script>
        <script>
            // gtfsClasses.js
            let use24HrClock = false
            let OccupancyStatus = {
                "EMPTY": "Empty",
                "MANY_SEATS_AVAILABLE": "Many seats available",
                "FEW_SEATS_AVAILABLE": "Few seats available",
                "STANDING_ROOM_ONLY": "Standing room only",
                "CRUSHED_STANDING_ROOM_ONLY": "Crushed standing room only",
                "FULL": "Full",
                "NOT_ACCEPTING_PASSENGERS": "Not accepting passengers",
                "NO_DATA_AVAILABLE": "No data",
                "NOT_BOARDABLE": "Not boardable"
            }

            class Stop{
                constructor(stopObj){
                    this.id = stopObj.id
                    this.name = stopObj.name
                    this.desc = stopObj.desc
                    this.lat = stopObj.lat
                    this.lon = stopObj.lon
                    this.tripStops = []

                    this.icon = null
                }

                updateIcon(){
                    if(this.icon != null){return}
                    this.icon = createBusStopIcon(this.id)
                }
                getPopupText(){
                    let text = `<h4>${this.name}</h4>`
                    if(this.desc != ""){ text += `\n${this.desc}` }
                    this.tripStops.forEach(ts=>{
                        let trip = trips[ts.tripId]
                        let route = routes[trip.getRouteId()]
                        let timePrefix = ts.isTimeExact ? "" : "Approx ~"
                        let style = `style="background-color: #${route.color}; color: #${route.textColor};"`
                        text += `\n
                        <span class="routeLabel" ${style}>${route.shortName}</span>
                        <span>${timePrefix}${clock24HrToPrefered(ts.arrivalTime)}</span>
                        <br><br>
                        `
                    })
                    return text
                }

                addTripStop(tripStopObject){
                    this.tripStops.push(tripStopObject)
                }
                sortScheduledStops(){
                    // ascending order, flip `b` and `a` for descending order
                    this.tripStops.sort((a,b)=>{return a.arrivalTimeSeconds - b.arrivalTimeSeconds})
                }
                onScheduleUpdated(){
                    if(this.tripStops.length == 0){
                        map.removeLayer(this.icon) // calling this many times seemingly is fine
                        return; // no more stops, that about all we can do
                    }
                    this.icon.bindPopup(this.getPopupText()) // update the text
                }

                getId(){return this.id }
                getName(){return this.name }
                getDesc(){return this.desc }
                getPosition(){return [this.lat, this.lon] }
            }

            class Shape{
                constructor(shapeObj){
                    this.id = shapeObj.id // str
                    this.points = shapeObj.points // list[ (lat,lon) ]
                    this.distanceTraveled = shapeObj.distanceTraveled // in km?
                }
                getId(){ return this.id }
                getPoints(){ return this.points }
            }

            class Route{
                constructor(routeObj, showRoute=false){
                    this.id = routeObj.id
                    this.shortName = routeObj.shortName
                    this.longName = routeObj.longName
                    this.color = routeObj.color
                    this.textColor = routeObj.textColor

                    this.polyLine = {}
                    this.allShapeIds = []
                    this.isRouteShown = showRoute
                }
                getId(){ return this.id }
                getShortName(){ return this.shortName }
                getLongName(){ return this.longName }
                getColor(){ return this.color }
                getTextColor(){ return this.textColor }
            }

            class Trip{
                constructor(tripObj){
                    this.id = tripObj.id
                    this.direction = tripObj.direction
                    this.stopTimes = tripObj.stopTimes
                    this.routeId = tripObj.routeId
                    this.shapeId = tripObj.shapeId

                    // we should now init our route w/ its shape
                    r = this.getRoute()
                    if(r.polyLine[this.getShapeId()] == null){
                        s = this.getShape()
                        r.polyLine[this.getShapeId()] = createRoutePolyline(s.getPoints(), r.getColor())
                        routes[r.getId()] = r
                    }

                    // set stops that will happen in the corresponding Stop data data
                    this.stopTimes.forEach(st=>{
                        stops[st["stopId"]].addTripStop(st)
                    })
                }
                getId(){ return this.id }
                getDirection(){ return this.direction }
                getRouteId(){ return this.routeId }
                getShapeId(){ return this.shapeId }

                getRoute(){ return routes[this.routeId] }
                getShape(){ return shapes[this.shapeId] }
            }

            class Vehicle{
                constructor(vehicleObj){
                    // put all of the init stuff inside of populateData since we'll call it to update our data instead of making new vehicle objects many times
                    this.populateData(vehicleObj)
                    
                    this.icon = null // icon to move when position updates
                    this.directionArrow = null // icon to point in the direction of travel
                }
                populateData(vehicleObj){
                    this.id = vehicleObj.id
                    this.startTime = vehicleObj.startTime
                    this.direction = vehicleObj.direction
                    this.lat = vehicleObj.lat
                    this.lon = vehicleObj.lon
                    this.bearing = vehicleObj.bearing // degresses CW from North
                    this.speed = vehicleObj.speed // m/s
                    this.timestamp = vehicleObj.timestamp
                    this.occupancyStatus = vehicleObj.occupancyStatus
                    this.tripId = vehicleObj.tripId
                }

                onUpdate(){
                    if(this.icon == null){
                        this.icon = createVehicleIcon(this.getId())
                    }
                    if(this.directionArrow == null){
                        this.directionArrow = createDirectionArrow(this.getId())
                    }
                    // TODO: seemingly after 11pm the route of some of the last buses change and then they freeze
                    //      Maybe we need to check if they're trip is gone, or if they're missing from the list
                    if(this.getTrip().getRoute().isRouteShown == false){
                        // we dont want to view this bus, so we're gonna put them in the middle of the ocean
                        this.lat = 0
                        this.lon = 0
                    }

                    this.icon.setLatLng( this.getPosition() )
                    this.directionArrow.setLatLng( this.getPosition() )
                    this.directionArrow.getElement().querySelector(".arrow").style.transform = `rotate(${v.getBearing()}deg)`
                }

                getId(){ return this.id }
                getStartTime(){ return this.startTime }
                getDirection(){ return this.direction }
                getPosition(){ return [this.lat, this.lon] }
                getBearing(){ return this.bearing }
                getSpeed(){ return this.speed }
                getTimestamp(){ return this.timestamp }
                getOccupancyStatus(){ return this.occupancyStatus }
                getTripId(){ return this.tripId }
                getTrip(){ return trips[this.getTripId()] }

                getPopupText(){
                    let trip = this.getTrip()
                    let route = trip.getRoute()

                    let label = `<span class="routeLabel" style="color: #${route.getTextColor()}; background-color: #${route.getColor()}">${route.getShortName()}</span>`
                    let info = `<span><strong>Seats</strong>: ${OccupancyStatus[this.getOccupancyStatus()]}</span>`


                    // TODO: remove this bearing and make each piece of info in-line
                    return `<div style='vehicleInfo'>
                        ${label}
                        <div>
                            <strong>Next Stop</strong>: Farmer Business School
                            <br>${info}
                        </div>
                    </div>`
                }
            }
        
        </script>
        <script>
            // index.js
            function getTimeSinceMidnight(){
                let date = new Date()
                return (date.getHours() * 60*60) + (date.getMinutes() * 60) + date.getSeconds()
            }

            function clock24HrToPrefered(hhmmss){
                if(use24HrClock){ return hhmmss }

                let postfix = "am"
                splits = hhmmss.split(":")
                hours = parseInt(splits[0])
                if(hours > 12){
                    hours -= 12
                    postfix = "pm"
                }
                return `${hours}:${splits[1]}:${splits[2]}${postfix}`
            }

            function removeOldStops(sinceMidnight=0){
                Object.keys(stops).forEach(sId=>{
                    let s = stops[sId]
                    let i = 0
                    while(i<s.tripStops.length){
                        let ts = s.tripStops[i]
                        // we'll leave it still there for ~2 minutes afterwards, incase the bus is running a bit late
                        if(ts.arrivalTimeSeconds+120 > sinceMidnight){ break; }
                        i++;
                    }
                    if(i != 0){
                        s.tripStops = s.tripStops.splice(i)
                        s.onScheduleUpdated()
                    }
                })
            }
            function newMinute(){
                // code that triggers at the start of every minute
                let sinceMidnight = getTimeSinceMidnight()
                // check if we're now within 1m:50s of midnight and if so, refresh the page so we can get our stops back
                if(sinceMidnight < 110){
                    console.log("Midnight has just passed, refreshing to get list of stops back")
                    document.location.reload()
                }

                removeOldStops(sinceMidnight)
                
            }
            setTimeout(() => {
                newMinute()
                setInterval(newMinute, 60_000)
            }, 60_000 - (Date.now()%60_000)); // initial delay to sync us to the minute
        </script>
        <script>
            // socket.js
            let URL = "ws://127.0.0.1:8002"
            let ws = new WebSocket(URL)

            ws.onopen = (e)=>{
                console.log("Websocket opened!")
            }

            ws.onclose = (e)=>{
                console.log("Websocket closed!")
            }

            ws.onerror = (e)=>{
                console.error(e)
            }

            ws.onmessage = (e)=>{
                let data = JSON.parse(e.data)
                let printData = true

                let type = data["type"]
                let packetData = data["data"]
                if(type == "stopsInfo"){
                    packetData.forEach(stopData => {
                        s = new Stop(stopData)
                        stops[s.getId()] = s
                        s.updateIcon()
                    });
                }
                else if(type == "shapesInfo"){
                    packetData.forEach(shapeData => {
                        s = new Shape(shapeData)
                        shapes[s.getId()] = s
                    });
                }
                else if(type == "routesInfo"){
                    packetData.forEach(routeData => {
                        r = new Route(routeData)
                        // show only the O1-O4 routes initially
                        if(r.getShortName().startsWith("O")){ r.showRoute = true; }
                        routes[r.getId()] = r
                    });
                }
                else if(type == "tripsInfo"){
                    packetData.forEach(tripData => {
                        t = new Trip(tripData)
                        trips[t.getId()] = t
                    });

                    Object.keys(routes).forEach(rId=>{
                        addRouteToControl(rId)
                    })
                    Object.keys(stops).forEach(sId=>{
                        stops[sId].sortScheduledStops()
                    })
                    removeOldStops(getTimeSinceMidnight())
                }
                else if(type == "feed"){
                    printData = false // dont print the 1 million feed packets we're gonna get
                    dataMadeTime = packetData["timestamp"]
                    packetData["vehicles"].forEach(vehicleData => {
                        vId = vehicleData.id
                        v = vehicles[vId]
                        if(v == null){
                            // new vehicle we haven't made an object for! Make it now 
                            v = new Vehicle(vehicleData)
                        }
                        else{
                            if(v.timestamp != vehicleData.timestamp){
                                // if the timestamps dont match then the vehicle has updated it's data!
                                v.populateData(vehicleData)
                                v.onUpdate()
                            }
                        }
                        vehicles[vId] = v
                        v.onUpdate()
                    });
                }
                else{
                    consle.error("Unknown type of packet!!")
                }

                if(printData){ console.log(data) }
            }

        </script>
    </body>
</html>
